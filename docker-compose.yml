services:
  agentguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentguard-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/data/agentguard.db
      # SECURITY — set both of these to strong random values before going live
      # Generate: openssl rand -hex 32
      - AGENTGUARD_API_KEY=${AGENTGUARD_API_KEY}
      - AGENTGUARD_ADMIN_KEY=${AGENTGUARD_ADMIN_KEY}
      # Rate limit: 500 requests per 15 minutes per IP (appropriate for AI agent workloads)
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-500}
      # Database backend: sqlite (default) or postgres
      - STORAGE_BACKEND=${STORAGE_BACKEND:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
      # Optional CORS restriction
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - agentguard_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: agentguard-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentguard}
      POSTGRES_DB: ${POSTGRES_DB:-agentguard}
    volumes:
      - agentguard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agentguard_data:
  agentguard_pg:
